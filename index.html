<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全国の開店予定</title>
  <meta name="description" content="GitHub上の最新JSONから全国の開店予定を表示します。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>全国の開店予定</h1>
      <p id="period">読み込み中…</p>
    </div>
  </header>

  <main class="container">
    <section class="status-card" aria-live="polite">
      <div>
        <strong id="count">—</strong> 店舗
      </div>
      <div id="updated">最終更新: —</div>
    </section>

    <section class="filters" aria-label="絞り込み">
      <label>
        都道府県
        <select id="prefectureFilter">
          <option value="">すべて</option>
        </select>
      </label>
      <label>
        カテゴリ
        <select id="categoryFilter">
          <option value="">すべて</option>
        </select>
      </label>
      <label class="search-field">
        店舗名検索
        <input id="search" type="search" placeholder="店舗名を入力…" autocomplete="off">
      </label>
    </section>

    <section id="message" class="message">データを読み込んでいます…</section>
    <section id="storeList" class="store-list" aria-live="polite"></section>
  </main>

  <template id="storeTemplate">
    <article class="store-card">
      <div class="store-main">
        <div class="store-date"></div>
        <h2 class="store-name"></h2>
        <p class="store-location"></p>
        <p class="store-category"></p>
        <span class="store-type"></span>
      </div>
      <div class="store-source">
        <a class="source-link" target="_blank" rel="noopener noreferrer">出典</a>
        <p class="evidence"></p>
      </div>
    </article>
  </template>

  <script src="script.js" defer></script>
</body>
</html>
